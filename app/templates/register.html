{% extends "base.html" %}
{% block title %}Register – StudyTrack{% endblock %}
{% block auth_content %}
<div class="auth-card card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-person-plus display-4 text-primary"></i>
            <h2 class="mt-2 fw-bold">Create Account</h2>
            <p class="text-muted">Join StudyTrack to stay on top of your studies</p>
        </div>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-person me-1"></i>Full Name</label>
                <input type="text" name="name" class="form-control form-control-lg"
                       placeholder="e.g. Jaimin Dudhat" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
                <input type="email" name="email" class="form-control form-control-lg"
                       placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
                <input type="password" name="password" class="form-control form-control-lg"
                       placeholder="Min. 6 characters" required minlength="6">
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-shield-lock me-1"></i>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control form-control-lg"
                       placeholder="Re-enter your password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                <i class="bi bi-person-plus me-2"></i>Register
            </button>
        </form>
        <p class="text-center text-muted mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-decoration-none">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
