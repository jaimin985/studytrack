{% extends "base.html" %}
{% block title %}Login – StudyTrack{% endblock %}
{% block auth_content %}
<div class="auth-card card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <i class="bi bi-journal-check display-4 text-primary"></i>
            <h2 class="mt-2 fw-bold">StudyTrack</h2>
            <p class="text-muted">Student Assignment & Exam Tracker</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
                <input type="email" name="email" class="form-control form-control-lg"
                       placeholder="you@example.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
                <input type="password" name="password" class="form-control form-control-lg"
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </button>
        </form>
        <p class="text-center text-muted mb-0">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="text-decoration-none">Register here</a>
        </p>
        <hr>
        <p class="text-center text-muted small mb-0">
            <i class="bi bi-info-circle me-1"></i>
            Demo: <code>demo@studytrack.com</code> / <code>Demo@123</code>
        </p>
    </div>
</div>
{% endblock %}
